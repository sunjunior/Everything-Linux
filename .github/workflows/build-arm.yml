name: Build Linux ARM binaries

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to attach ARM assets to"
        required: true
        default: "v0.2.1beta"
      static:
        description: "Build static CLI/daemon (1) or dynamic (0)"
        required: true
        default: "1"

permissions:
  contents: write

jobs:
  aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK3 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libglib2.0-dev libpango1.0-dev libcairo2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        env:
          CARGO_FLAGS: "--locked"
          STATIC: ${{ inputs.static }}
        run: ./build-static.sh

      - name: Package
        run: |
          mkdir -p package
          cp dist/everything dist/everythingd dist/everything-gtk README.md LICENSE package/
          tar -czf everything-linux-aarch64.tar.gz -C package .
          file dist/everything dist/everythingd dist/everything-gtk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: everything-linux-aarch64
          path: everything-linux-aarch64.tar.gz

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ inputs.release_tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "${{ inputs.release_tag }}" everything-linux-aarch64.tar.gz \
            --clobber --repo "$GITHUB_REPOSITORY"

  armv7:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Build in armv7 container
        run: |
          docker run --rm --platform linux/arm/v7 \
            -v "$PWD:/work" -w /work \
            -e STATIC="${{ inputs.static }}" \
            arm32v7/debian:bookworm-slim \
            bash -lc '
              set -eux
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                build-essential pkg-config libgtk-3-dev libglib2.0-dev libpango1.0-dev libcairo2-dev \
                ca-certificates curl git
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
              . "$HOME/.cargo/env"
              export CARGO_FLAGS="--locked"
              ./build-static.sh
            '

      - name: Package
        run: |
          mkdir -p package
          cp dist/everything dist/everythingd dist/everything-gtk README.md LICENSE package/
          tar -czf everything-linux-armv7.tar.gz -C package .
          file dist/everything dist/everythingd dist/everything-gtk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: everything-linux-armv7
          path: everything-linux-armv7.tar.gz

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ inputs.release_tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "${{ inputs.release_tag }}" everything-linux-armv7.tar.gz \
            --clobber --repo "$GITHUB_REPOSITORY"

  finalize:
    needs: [aarch64, armv7]
    runs-on: ubuntu-24.04
    steps:
      - name: Download ARM assets
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Append ARM assets to release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ inputs.release_tag }}"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json body -q .body > body.md
          awk '
            /^## ARM 构建产物$/ {skip=1; next}
            skip && /^## / {skip=0}
            !skip {print}
          ' body.md > new.md
          {
            echo
            echo "## ARM 构建产物"
            echo
            echo "| 架构 | 资产 | SHA256 |"
            echo "|---|---|---|"
            for a in everything-linux-aarch64.tar.gz everything-linux-armv7.tar.gz; do
              sha=$(sha256sum "assets/$a" | awk '{print $1}')
              case "$a" in
                *aarch64*) arch=aarch64 ;;
                *armv7*) arch=armv7 ;;
              esac
              echo "| $arch | \`$a\` | \`$sha\` |"
            done
          } >> new.md
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file new.md
